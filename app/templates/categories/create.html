{% extends "base.html" %}

{% block title %}Add Category - IEMS{% endblock %}


{% block content %}

<div class="page-header">

    <div>

        <div class="breadcrumb">
            <a href="{{ url_for('dashboard.index') }}">Dashboard</a>
            <span>/</span>
            <a href="{{ url_for('categories.index') }}">Categories</a>
            <span>/</span>
            <span>Add</span>
        </div>

        <h1>Add Category</h1>

        <p>
            Create a new equipment category.
        </p>

    </div>

</div>


<div class="card form-card">

    <div class="card-header">

        <div>

            <h2>Category Details</h2>

            <p>
                Categories classify equipment across IEMS.
            </p>

        </div>

    </div>


    <form method="POST">

        <div class="form-section">

            <div class="form-group">

                <label for="name">
                    Name
                    <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                    placeholder="e.g. Laptops"
                    value="{{ request.form.get('name', '') }}"
                    autofocus
                >

                <small class="form-help">
                    Must be unique across all categories.
                </small>

            </div>


            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    rows="4"
                    placeholder="Optional. What sort of equipment belongs here?"
                >{{ request.form.get('description', '') }}</textarea>

            </div>

        </div>


        <div class="form-actions">

            <a
                href="{{ url_for('categories.index') }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="btn btn-primary"
            >
                Create Category
            </button>

        </div>

    </form>

</div>

{% endblock %}
