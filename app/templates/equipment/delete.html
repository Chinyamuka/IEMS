<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Delete {{ equipment.asset_tag }} - IEMS
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='css/style.css'
        ) }}"
    >

</head>


<body>

    <main class="container">


        <div class="delete-box">

            <h1>
                Delete Equipment
            </h1>


            <p>
                Are you sure you want to permanently delete
                this equipment record?
            </p>


            <div class="delete-equipment">

                <strong>
                    {{ equipment.asset_tag }}
                </strong>

                <span>
                    {{ equipment.manufacturer }}
                    {{ equipment.model }}
                </span>

            </div>


            <p class="warning">

                ⚠ This action cannot be undone.

            </p>


            <form method="POST">

                <!-- CSRF protection -->
                {{ csrf_token() }}


                <div class="actions">


                    <!-- Cancel -->

                    <a
                        href="{{ url_for(
                            'equipment.detail',
                            equipment_id=equipment.id
                        ) }}"
                        class="btn secondary"
                    >
                        Cancel
                    </a>


                    <!-- Confirm Delete -->

                    <button
                        type="submit"
                        class="btn danger"
                    >
                        Delete Equipment
                    </button>


                </div>

            </form>

        </div>


    </main>

</body>

</html>
