<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            IEMS
        {% endblock %}
    </title>

    <!-- Main IEMS stylesheet -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>

<div class="app-shell">

    <!-- =====================================================
         NAVIGATION BAR
         ===================================================== -->

    <header class="navbar">

        <div class="navbar-inner">

            <!-- Brand -->

            <a
                href="{{ url_for('dashboard.index') }}"
                class="brand"
            >

                <span class="brand-icon">
                    ICT
                </span>

                <span>
                    IEMS
                </span>

            </a>


            <!-- Navigation -->

            <nav class="nav-links">

                <a
                    href="{{ url_for('dashboard.index') }}"
                >
                    Dashboard
                </a>

                <a
                    href="{{ url_for('equipment.index') }}"
                >
                    Equipment
                </a>

                <a
                    href="{{ url_for('equipment.create') }}"
                >
                    Add Equipment
                </a>

            </nav>

        </div>

    </header>


    <!-- =====================================================
         MAIN APPLICATION CONTENT
         ===================================================== -->

    <main class="main-container">

        <!-- Flash messages -->

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                <div class="flash-messages">

                    {% for category, message in messages %}

                        <div class="alert {{ category }}">

                            {{ message }}

                        </div>

                    {% endfor %}

                </div>

            {% endif %}

        {% endwith %}


        <!-- Page content -->

        {% block content %}

        {% endblock %}

    </main>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer class="footer">

        <div class="footer-inner">

            <span>
                IEMS © 2026
            </span>

            <span>
                ICT Equipment Management System
            </span>

        </div>

    </footer>

</div>

</body>

</html>
