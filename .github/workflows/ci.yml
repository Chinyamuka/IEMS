name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Cancel in-flight runs when a new commit lands on the same ref.
# Saves CI minutes and prevents confusing "old run is now green"
# notifications.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-ci.txt

      - name: Run tests
        env:
          # pytest instantiates the app via create_app(), which
          # reads these from .env normally. In CI, .env is not
          # committed, so we pass them as env vars.
          SECRET_KEY: "ci-only-not-secret"
          DATABASE_URL: "sqlite:///:memory:"
          CACHE_ENABLED: "false"
          MAIL_ENABLED: "false"
          MAIL_SUPPRESS_SEND: "true"
        run: |
          pytest -q --maxfail=5